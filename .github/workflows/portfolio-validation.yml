name: Web Portfolio Validation

on:
  push:
    paths:
      - "README.md"
      - "index.html"
      - "styles.css"
      - "script.js"
      - "projects.json"
      - "brief-builder.js"
      - "page-motion.js"
      - "website-development.html"
      - "website-service.css"
      - "telegram-bots.html"
      - "projects/**"
      - "tests/**"
      - ".github/workflows/portfolio-validation.yml"
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "projects.json"
      - "brief-builder.js"
      - "page-motion.js"
      - "website-development.html"
      - "website-service.css"
      - "telegram-bots.html"
      - "projects/**"
      - "tests/**"
      - ".github/workflows/portfolio-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-and-link-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project data, demo pages and local links
        run: python -m unittest discover -s tests -v
