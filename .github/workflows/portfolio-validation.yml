name: Web Portfolio Validation

on:
  push:
    paths:
      - "README.md"
      - "index.html"
      - "styles.css"
      - "script.js"
      - "projects.json"
      - "brief-builder.js"
      - "page-motion.js"
      - "website-development.html"
      - "website-service.css"
      - "telegram-bots.html"
      - "projects/**"
      - "products/**"
      - "smm/**"
      - "resume/**"
      - "docs/**"
      - "tests/**"
      - "requirements-test.txt"
      - ".github/workflows/portfolio-validation.yml"
  pull_request:
    paths:
      - "README.md"
      - "index.html"
      - "styles.css"
      - "script.js"
      - "projects.json"
      - "brief-builder.js"
      - "page-motion.js"
      - "website-development.html"
      - "website-service.css"
      - "telegram-bots.html"
      - "projects/**"
      - "products/**"
      - "smm/**"
      - "resume/**"
      - "docs/**"
      - "tests/**"
      - "requirements-test.txt"
      - ".github/workflows/portfolio-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-and-link-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project data, demo pages and local links
        run: |
          python -m unittest discover -s tests -p 'test_portfolio_content.py' -v
          python -m unittest discover -s tests -p 'test_smm_page.py' -v

  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install browser test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Playwright browser regressions
        run: |
          mkdir -p reports
          pytest -q tests/test_browser_regression.py --junitxml=reports/browser-junit.xml

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-portfolio-browser-regression
          path: reports/browser-junit.xml
          if-no-files-found: warn
          retention-days: 14
